<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UIL Math Trainer</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>UIL Math Trainer</h1>
    <nav>
      <button onclick="showPage('home')">Home</button>
      <button onclick="showPage('practice')">Practice</button>
      <button onclick="showPage('timed')">Timed Test</button>
      <button onclick="showPage('review')">Review</button>
      <button onclick="showPage('pastTests')">Past Tests</button>
    </nav>
  </header>

  <!-- HOME -->
  <section id="home" class="page active">
    <h2>Welcome</h2>
    <p>Train for UIL Mathematics with practice problems, timed tests, and past contest archives.</p>
  </section>

  <!-- PRACTICE -->
  <section id="practice" class="page">
    <h2>Practice by Topic</h2>
   <div class="button-row">
  <button onclick="startPractice('algebra')">Algebra</button>
  <button onclick="startPractice('geometry')">Geometry</button>
  <button onclick="startPractice('numberTheory')">Number Theory</button>
  <button onclick="startPractice('probability')">Probability</button>
  <button onclick="startPractice('sequences')">Sequences</button>
  <button onclick="startPractice('exponents')">Exponents & Logs</button>
  <button onclick="startPractice('quadratics')">Quadratics</button>
  <button onclick="startPractice('systems')">Systems</button>
  <button onclick="startPractice('matrices')">Matrices</button>
  <button onclick="startPractice('word')">Word Problems</button>
</div>

    <div id="practiceArea"></div>
  </section>

  <!-- TIMED TEST -->
  <section id="timed" class="page">
    <h2>Timed Test</h2>
    <button onclick="startTimedTest()">Start 30-Minute Test</button>
    <div id="timer"></div>
    <div id="timedArea"></div>
  </section>

  <!-- REVIEW -->
  <section id="review" class="page">
    <h2>Review Missed Problems</h2>
    <div id="reviewList"></div>
  </section>

  <!-- PAST TESTS -->
  <section id="pastTests" class="page">
    <h2>Past UIL Tests</h2>
    <p>Select a year:</p>
    <div id="yearList"></div>
    <div id="testList"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
